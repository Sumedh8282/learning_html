<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <marquee>
        <h1>Welcome to my website</h1>
    </marquee>

    <marquee behaviour="alternate">
        <h1>Welcome to my website</h1>
    </marquee>

    <marquee direction="right" behavior="alternate" height="200px" bgcolor="lightblue">
        <h1>Welcome Sumedh</h1>
    </marquee>
    
    <marquee direction="up" loop="2" behavior="alternate" height="200px" bgcolor="lightblue">
        <h1>Welcome Sumedh</h1>
    </marquee>

    <marquee direction="right" scrollamount="2" behavior="alternate" height="200px" bgcolor="lightblue">
        <h1>Welcome Sumedh</h1>
    </marquee>
</body>
</html>
